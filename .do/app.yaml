# Single-service deploy (API + UI). Fixes "Cannot GET /" on DigitalOcean.
# UI is built into backend/public during `npm run build`, then Express serves it.

name: selfie-verification
region: nyc

services:
  - name: web
    github:
      repo: AjumaPro/selfie-verification
      branch: main
      deploy_on_push: true
    # Entire monorepo (root package.json builds UI + starts API)
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: npm run build
    run_command: npm start
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: JWT_EXPIRES_IN
        value: 7d
        scope: RUN_TIME
      - key: CORS_ORIGIN
        value: "*"
        scope: RUN_TIME
      - key: SUPERADMIN_NAME
        value: Super Admin
        scope: RUN_TIME
      - key: REACT_APP_AUTH_API_URL
        value: ""
        scope: BUILD_TIME
      - key: REACT_APP_API_BASE_URL
        value: https://selfie.imsgh.org:2035/skyface
        scope: BUILD_TIME
      - key: REACT_APP_DEFAULT_CENTER
        value: BRANCHLESS
        scope: BUILD_TIME
      - key: DATABASE_URL
        type: SECRET
        value: REPLACE_WITH_NEON_DATABASE_URL
        scope: RUN_TIME
      - key: JWT_SECRET
        type: SECRET
        value: REPLACE_WITH_LONG_RANDOM_SECRET
        scope: RUN_TIME
      - key: SUPERADMIN_EMAIL
        type: SECRET
        value: superadmin@glico.local
        scope: RUN_TIME
      - key: SUPERADMIN_PASSWORD
        type: SECRET
        value: REPLACE_WITH_STRONG_PASSWORD
        scope: RUN_TIME
      - key: REACT_APP_DEFAULT_USER_ID
        type: SECRET
        value: REPLACE_WITH_KYC_USER_ID
        scope: BUILD_TIME
      - key: REACT_APP_DEFAULT_MERCHANT_KEY
        type: SECRET
        value: REPLACE_WITH_KYC_MERCHANT_KEY
        scope: BUILD_TIME
