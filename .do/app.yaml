# DigitalOcean App Platform — monorepo
# UI at /  ·  API at /api and /health
#
# Create via: Apps → Create App → upload this file as App Spec
# OR: GitHub source with Source Directory set per component (see DEPLOY-DIGITALOCEAN.md)

name: selfie-verification
region: nyc

services:
  - name: api
    github:
      repo: AjumaPro/selfie-verification
      branch: main
      deploy_on_push: true
    source_dir: backend
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: npm ci
    run_command: npm run start:prod
    health_check:
      http_path: /health
    routes:
      - path: /api
      - path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: SUPERADMIN_NAME
        value: Super Admin
      # Set these in the DO dashboard (Settings → App-Level / Component env):
      - key: DATABASE_URL
        type: SECRET
        value: REPLACE_WITH_NEON_DATABASE_URL
      - key: JWT_SECRET
        type: SECRET
        value: REPLACE_WITH_LONG_RANDOM_SECRET
      - key: SUPERADMIN_EMAIL
        type: SECRET
        value: superadmin@glico.local
      - key: SUPERADMIN_PASSWORD
        type: SECRET
        value: REPLACE_WITH_STRONG_PASSWORD

static_sites:
  - name: web
    github:
      repo: AjumaPro/selfie-verification
      branch: main
      deploy_on_push: true
    source_dir: frontend
    environment_slug: node-js
    build_command: npm ci && node download-models.js && npm run build
    output_dir: build
    index_document: index.html
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: REACT_APP_AUTH_API_URL
        scope: BUILD_TIME
        value: ""
      - key: REACT_APP_API_BASE_URL
        scope: BUILD_TIME
        value: https://selfie.imsgh.org:2035/skyface
      - key: REACT_APP_DEFAULT_CENTER
        scope: BUILD_TIME
        value: BRANCHLESS
      - key: REACT_APP_DEFAULT_USER_ID
        scope: BUILD_TIME
        type: SECRET
        value: REPLACE_WITH_KYC_USER_ID
      - key: REACT_APP_DEFAULT_MERCHANT_KEY
        scope: BUILD_TIME
        type: SECRET
        value: REPLACE_WITH_KYC_MERCHANT_KEY
