# Single-service deploy (API + UI) + App Platform Postgres.
# UI is built into backend/public during `npm run build`, then Express serves it.
# Production uses Postgres only (DB_CLIENT is never sqlite here).

name: selfie-verification
region: nyc

databases:
  - name: db
    engine: PG
    version: "16"
    production: false

services:
  - name: web
    github:
      repo: AjumaPro/selfie-verification
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: npm run build
    run_command: npm start
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: DB_CLIENT
        value: postgres
        scope: RUN_TIME
      - key: JWT_EXPIRES_IN
        value: 7d
        scope: RUN_TIME
      - key: CORS_ORIGIN
        value: "*"
        scope: RUN_TIME
      - key: SUPERADMIN_NAME
        value: Super Admin
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
        value: glico-selfie-prod-jwt-change-me-in-console
        scope: RUN_TIME
      - key: SUPERADMIN_EMAIL
        type: SECRET
        value: superadmin@glico.local
        scope: RUN_TIME
      - key: SUPERADMIN_PASSWORD
        type: SECRET
        value: SuperAdmin@123
        scope: RUN_TIME
      - key: REACT_APP_AUTH_API_URL
        value: ""
        scope: BUILD_TIME
      - key: REACT_APP_API_BASE_URL
        value: https://selfie.imsgh.org:2035/skyface
        scope: BUILD_TIME
      - key: REACT_APP_DEFAULT_CENTER
        value: BRANCHLESS
        scope: BUILD_TIME
      - key: REACT_APP_DEFAULT_USER_ID
        type: SECRET
        value: REPLACE_WITH_KYC_USER_ID
        scope: BUILD_TIME
      - key: REACT_APP_DEFAULT_MERCHANT_KEY
        type: SECRET
        value: REPLACE_WITH_KYC_MERCHANT_KEY
        scope: BUILD_TIME
