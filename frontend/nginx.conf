server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA + static assets
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed static files
  location /static/ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location /models/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
